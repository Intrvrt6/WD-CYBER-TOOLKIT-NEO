[pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # argon2-cffi: resolved by reading distribution metadata in capabilities.py
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning
    # starlette/httpx2 shim comes from the sandbox's sitecustomize, not this repo
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: exercises real subprocess or network behaviour
